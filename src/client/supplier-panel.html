<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Панель поставщика</title>
  <link rel="stylesheet" href="css/supplier2.css">
</head>
<body>
  <div class="container">
    <h1>Панель поставщика</h1>
    <button id="openModal" class="add-btn">Добавить товар</button>

    <!-- Список товаров -->
    <div id="productList" class="product-grid"></div>
  </div>

  <!-- Модальное окно -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <h2>Добавить товар</h2>
      <form id="productForm">
        <input type="text" id="title" placeholder="Название" required />
        <select id="category" required></select>
        <input type="number" id="price" placeholder="Цена" required />
        <textarea id="description" placeholder="Описание"></textarea>
        <input type="number" id="stock" placeholder="Количество" required />
        <input type="url" id="image" placeholder="URL изображения" required />
        <button type="submit">Добавить</button>
      </form>
    </div>
  </div>
  
  <script src="js/supplier.js"></script>
</body>
</html>
